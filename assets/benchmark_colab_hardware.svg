<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="420">
  <style>
    .bg { fill: #0d1117; rx: 8px; }
    .title { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .label { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .label-poly { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .val { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .bar-other { fill: #30363d; rx: 4px; }
    .bar-poly { fill: #1f6feb; rx: 4px; }
  </style>

  <rect width="800" height="420" class="bg"/>

  <text x="25" y="35" class="title">Google Colab Free Tier Throughput (GB/s, 3x 8B Merge)</text>

  <!-- MergeKit (CPU) -->
  <text x="25" y="75" class="label">MergeKit (CPU)</text>
  <rect x="200" y="59" width="37" height="22" class="bar-other"/>
  <text x="247" y="75" class="val">0.22 GB/s</text>

  <!-- MergeKit (GPU T4) -->
  <text x="25" y="115" class="label">MergeKit (GPU T4)</text>
  <rect x="200" y="99" width="137" height="22" class="bar-other"/>
  <text x="347" y="115" class="val">0.82 GB/s</text>

  <!-- OmniMergeKit (CPU) -->
  <text x="25" y="165" class="label">OmniMergeKit (CPU)</text>
  <rect x="200" y="149" width="62" height="22" class="bar-other"/>
  <text x="272" y="165" class="val">0.37 GB/s</text>

  <!-- OmniMergeKit (GPU T4) -->
  <text x="25" y="205" class="label">OmniMergeKit (GPU T4)</text>
  <rect x="200" y="189" width="208" height="22" class="bar-other"/>
  <text x="418" y="205" class="val">1.25 GB/s</text>

  <!-- PolyMerge (CPU) -->
  <text x="25" y="255" class="label-poly">PolyMerge (CPU)</text>
  <rect x="200" y="239" width="92" height="22" class="bar-poly"/>
  <text x="302" y="255" class="val" fill="#58a6ff">0.55 GB/s</text>

  <!-- PolyMerge (GPU T4) -->
  <text x="25" y="295" class="label-poly">PolyMerge (GPU T4)</text>
  <rect x="200" y="279" width="317" height="22" class="bar-poly"/>
  <text x="527" y="295" class="val" fill="#58a6ff">1.90 GB/s</text>

  <!-- PolyMerge (TPU) -->
  <text x="25" y="335" class="label-poly">PolyMerge (TPU)</text>
  <rect x="200" y="319" width="517" height="22" class="bar-poly"/>
  <text x="727" y="335" class="val" fill="#58a6ff">3.10 GB/s</text>
</svg>
