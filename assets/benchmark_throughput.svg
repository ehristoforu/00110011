<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <style>
    .bg { fill: #0d1117; rx: 8px; }
    .title { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .label { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .label-poly { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .val { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .bar-other { fill: #30363d; rx: 4px; }
    .bar-poly { fill: url(#polyGrad); rx: 4px; }
  </style>
  <defs>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" class="bg"/>

  <text x="25" y="35" class="title">Merge Throughput Speedup (RTX 3060 12GB / 32GB RAM)</text>

  <!-- MergeKit -->
  <text x="25" y="80" class="label">MergeKit</text>
  <rect x="140" y="64" width="220" height="24" class="bar-other"/>
  <text x="370" y="81" class="val">1.0x (Baseline)</text>

  <!-- OmniMergeKit -->
  <text x="25" y="130" class="label">OmniMergeKit</text>
  <rect x="140" y="114" width="352" height="24" class="bar-other"/>
  <text x="502" y="131" class="val">1.6x</text>

  <!-- PolyMerge -->
  <text x="25" y="180" class="label-poly">PolyMerge</text>
  <rect x="140" y="164" width="528" height="24" class="bar-poly"/>
  <text x="678" y="181" class="val" fill="#58a6ff">2.4x</text>
</svg>
