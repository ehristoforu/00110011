staged: true
stages:
  - name: "Stage 1: Blending Specialized Instruct"
    merge_method: linear
    models:
      - model: model_a
        weight: 0.5
      - model: model_b
        weight: 0.5
    dtype: bfloat16

  - name: "Stage 2: DARE-TIES with Base Foundation"
    merge_method: dare_ties
    base_model: base_foundation
    use_previous_output_as_base: false
    models:
      - model: PREVIOUS_STAGE
        weight: 0.7
        density: 0.6
      - model: model_c
        weight: 0.3
        density: 0.6
    dtype: bfloat16
