[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymerge"
version = "0.1.0"
description = "High-performance, architecture-agnostic LLM model merger (safetensors, gguf, multi-backend, staged)"
readme = "README.md"
authors = [{ name = "ehristoforu" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.22.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
fast = ["hf-transfer>=0.1.4", "hf-xet>=0.1.0"]
gguf = ["gguf>=0.10.0"]
tpu = ["torch_xla"]
all = ["hf-transfer>=0.1.4", "hf-xet>=0.1.0", "gguf>=0.10.0"]

[project.scripts]
polymerge = "polymerge.cli:main"

[tool.setuptools.packages.find]
include = ["polymerge*"]

